server {
  listen 80;
  server_name _;

  auth_basic "SafeWager Preview";
  auth_basic_user_file /etc/nginx/.htpasswd-safewager;

  root /var/www/safewager;
  index index.html;

  location ~ ^/(auth/|health$|integrity-|balance/|create-|payment-methods/|deposit-with-saved-card$|withdraw$|wagers(?:/.*)?$|lock-wager$|start-match-server$|matches/|match-result$|wager-result$|profile/|server-slots$|internal/) {
    proxy_pass http://127.0.0.1:4242;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
